<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Планировщик юриста v2.2 (Яндекс Облако)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #263349;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --purple: #8b5cf6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
    button, input, select, textarea { font-family: inherit; font-size: 14px; }
    button { cursor: pointer; border: none; border-radius: 8px; transition: 0.15s; }
    input, select, textarea {
      width: 100%; background: #0f172a; color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }

    /* Экран входа */
    #authScreen {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .auth-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .auth-box h2 { text-align: center; margin-bottom: 6px; font-size: 22px; }
    .auth-sub { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .auth-field { margin-bottom: 14px; }
    .auth-field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .btn-primary {
      width: 100%; background: var(--primary); color: #fff; font-weight: 600; padding: 12px;
    }
    .btn-primary:hover { background: var(--primary-hover); }
    .auth-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 12px; min-height: 18px; }

    /* Основной интерфейс */
    #appScreen { display: none; max-width: 1100px; margin: 0 auto; padding: 14px; }
    .topbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
      gap: 10px; background: var(--card); border: 1px solid var(--border);
      padding: 12px 16px; border-radius: 12px; margin-bottom: 14px;
    }
    .topbar h1 { font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .top-actions { display: flex; align-items: center; gap: 8px; }
    .sync-status { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .btn-sm { padding: 8px 12px; font-weight: 600; font-size: 13px; background: #334155; color: var(--text); }
    .btn-sm:hover { background: #475569; }
    .btn-danger-sm { background: rgba(239, 68, 68, 0.15); color: #fca5a5; }
    .btn-danger-sm:hover { background: rgba(239, 68, 68, 0.3); }

    /* Счётчики */
    .stats-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 14px;
    }
    @media (max-width: 700px) { .stats-grid { grid-template-columns: repeat(3, 1fr); } }
    .stat-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px; text-align: center;
    }
    .stat-num { font-size: 20px; font-weight: 700; margin-bottom: 2px; }
    .stat-lbl { font-size: 11px; color: var(--muted); }

    /* Панель фильтров */
    .filters-bar {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center;
    }
    .filters-bar select { width: auto; min-width: 160px; flex: 1; }
    .filters-bar input { flex: 2; min-width: 200px; }
    .btn-add {
      background: var(--success); color: #fff; font-weight: 600; padding: 10px 16px; white-space: nowrap;
    }
    .btn-add:hover { background: #059669; }

    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .tab-btn {
      background: var(--card); color: var(--muted); border: 1px solid var(--border);
      padding: 7px 12px; font-size: 13px; border-radius: 20px;
    }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Список дел */
    .cases-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
    .case-card {
      background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--primary);
      border-radius: 12px; padding: 14px; cursor: pointer; transition: 0.15s;
      display: flex; flex-direction: column; justify-content: space-between; gap: 8px;
    }
    .case-card:hover { background: var(--card-hover); transform: translateY(-1px); }
    .case-card.overdue { border-left-color: var(--danger); }
    .case-card.urgent { border-left-color: var(--warning); }
    .case-card.court { border-left-color: var(--purple); }
    .case-card.done { border-left-color: var(--success); opacity: 0.72; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .badge {
      font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px;
      background: rgba(59, 130, 246, 0.18); color: #93c5fd;
    }
    .badge.overdue { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    .badge.urgent { background: rgba(245, 158, 11, 0.2); color: #fcd34d; }
    .badge.court { background: rgba(139, 92, 246, 0.2); color: #c4b5fd; }
    .badge.done { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }

    .debtor-name { font-size: 16px; font-weight: 700; line-height: 1.3; }
    .meta-line { font-size: 12px; color: var(--muted); }
    .task-preview {
      font-size: 13px; color: #e2e8f0; background: rgba(15, 23, 42, 0.5);
      padding: 8px; border-radius: 8px; white-space: pre-line;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 8px;
    }

    /* Модальные окна */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: none; align-items: center; justify-content: center; padding: 12px; z-index: 100;
    }
    .modal {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 18px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 14px;
    }
    .modal-header h2 { font-size: 18px; }
    .close-btn { background: transparent; color: var(--muted); font-size: 24px; line-height: 1; padding: 0 6px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .quick-dates { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .quick-dates button {
      background: #334155; color: #e2e8f0; font-size: 12px; padding: 5px 9px; border-radius: 6px;
    }
    .quick-dates button:hover { background: var(--primary); color: #fff; }
    .modal-footer {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end;
      margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
    }

    /* История и просмотр карточки */
    .detail-row { margin-bottom: 10px; font-size: 14px; }
    .detail-row strong { color: var(--muted); font-weight: 500; display: inline-block; min-width: 125px; }
    .history-list {
      background: #0f172a; border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; max-height: 180px; overflow-y: auto; margin-top: 6px;
    }
    .history-item { font-size: 12px; padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .history-item:last-child { border-bottom: none; }
    .history-date { color: var(--primary); font-weight: 600; margin-right: 6px; }
    .file-pill {
      display: inline-flex; align-items: center; gap: 8px; background: #0f172a;
      border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; margin-top: 6px; font-size: 13px;
    }
    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 40px 16px;
      color: var(--muted); background: var(--card); border-radius: 12px; border: 1px dashed var(--border);
    }
  </style>
</head>
<body>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<div id="authScreen">
  <div class="auth-box">
    <h2>⚖ Планировщик юриста</h2>
    <div class="auth-sub">Яндекс Облако • Синхронизация ПК ↔ Телефон</div>
    <div class="auth-field">
      <label>Логин (Email)</label>
      <input type="email" id="loginInput" placeholder="name@gmail.com" autocomplete="username" />
    </div>
    <div class="auth-field">
      <label>Пароль</label>
      <input type="password" id="passInput" placeholder="••••••••" autocomplete="current-password" />
    </div>
    <button class="btn-primary" id="loginBtn">Войти в систему</button>
    <div class="auth-error" id="authError"></div>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="appScreen">
  <div class="topbar">
    <div>
      <h1>⚖ Планировщик v2.2 Я.Облако</h1>
      <div class="sync-status" id="syncStatus">Готово к работе</div>
    </div>
    <div class="top-actions">
      <button class="btn-sm" id="syncBtn">🔄 Синхр.</button>
      <button class="btn-sm btn-danger-sm" id="logoutBtn">Выход</button>
    </div>
  </div>

  <!-- СЧЁТЧИКИ -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-num" id="cntWork">0</div><div class="stat-lbl">В работе</div></div>
    <div class="stat-card"><div class="stat-num" id="cntCourt" style="color:#c4b5fd">0</div><div class="stat-lbl">Суды</div></div>
    <div class="stat-card"><div class="stat-num" id="cntWait" style="color:#94a3b8">0</div><div class="stat-lbl">Ждут дату</div></div>
    <div class="stat-card"><div class="stat-num" id="cntUrgent" style="color:#fcd34d">0</div><div class="stat-lbl">Срочно ≤3д</div></div>
    <div class="stat-card"><div class="stat-num" id="cntOverdue" style="color:#fca5a5">0</div><div class="stat-lbl">Просрочено</div></div>
  </div>

  <!-- ФИЛЬТРЫ -->
  <div class="filters-bar">
    <select id="lfoFilter"><option value="ALL">Все ЛФО (0)</option></select>
    <input type="text" id="searchInput" placeholder="Поиск: должник, № ИП/дела, РОСП, суд..." />
    <button class="btn-add" id="newCaseBtn">+ Новое дело</button>
  </div>

  <div class="tabs" id="filterTabs">
    <button class="tab-btn active" data-filter="active">Все активные</button>
    <button class="tab-btn" data-filter="overdue">🔥 Просрочено</button>
    <button class="tab-btn" data-filter="urgent">⏰ Срочно</button>
    <button class="tab-btn" data-filter="court">⚖ Суды</button>
    <button class="tab-btn" data-filter="nodate">⏳ Без даты</button>
    <button class="tab-btn" data-filter="done">✅ Завершённые</button>
  </div>

  <div class="cases-list" id="casesList"></div>
</div>

<!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ / РЕДАКТИРОВАНИЯ -->
<div class="modal-backdrop" id="editModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="editModalTitle">Новое дело / задача</h2>
      <button class="close-btn" onclick="closeModal('editModal')">×</button>
    </div>
    <input type="hidden" id="editId" />

    <div class="form-grid">
      <div class="form-group">
        <label>Статус</label>
        <select id="fStatus">
          <option value="work">В работе (ИП / запрос)</option>
          <option value="court">Судебное заседание</option>
          <option value="nodate">Не назначено (ждём дату)</option>
          <option value="done">Завершено</option>
        </select>
      </div>
      <div class="form-group">
        <label>Категория</label>
        <select id="fCategory">
          <option value="ИП / ФССП">ИП / ФССП</option>
          <option value="Жалоба ФССП (45 дн.)">Жалоба ФССП (45 дн.)</option>
          <option value="Суд / Иск">Суд / Иск</option>
          <option value="Банкротство">Банкротство</option>
          <option value="ЗНСР / Списание">ЗНСР / Списание</option>
          <option value="Прочее">Прочее</option>
        </select>
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>ЛФО / Взыскатель</label>
        <input type="text" id="fLfo" placeholder="Напр. Сбер / ПКБ / ЛФО-1" />
      </div>
      <div class="form-group">
        <label>№ дела / № ИП</label>
        <input type="text" id="fNumber" placeholder="12345/26/50038-ИП" />
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Должник (ФИО / Наименование) *</label>
        <input type="text" id="fDebtor" placeholder="Иванов Иван Иванович" />
      </div>
      <div class="form-group">
        <label>Орган (РОСП / Суд)</label>
        <input type="text" id="fOrgan" placeholder="Сергиево-Посадский РОСП" />
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Контрольная дата / Суд</label>
        <input type="date" id="fDate" />
      </div>
      <div class="form-group">
        <label>Время суда (если суд)</label>
        <input type="time" id="fTime" value="10:00" />
      </div>
    </div>

    <div class="form-group">
      <div class="quick-dates">
        <button type="button" onclick="addDays(7)">+7 дн.</button>
        <button type="button" onclick="addDays(14)">+14 дн.</button>
        <button type="button" onclick="addDays(30)">+30 дн.</button>
        <button type="button" onclick="addDays(45)">+45 дн. (жалоба ФССП)</button>
      </div>
    </div>

    <div class="form-group">
      <label>Суть задачи / Комментарий</label>
      <textarea id="fNote" rows="3" placeholder="Напр.: Направлен запрос приставу через Госуслуги..."></textarea>
    </div>

    <div class="form-group">
      <label>Ссылка (КАД / Госуслуги / ФССП)</label>
      <input type="url" id="fLink" placeholder="https://..." />
    </div>

    <div class="form-group">
      <label>Добавить запись в историю действий (необязательно)</label>
      <input type="text" id="fHistoryAdd" placeholder="Напр.: Подана жалоба в порядке подчиненности" />
    </div>

    <div class="form-group">
      <label>Прикрепить фото или PDF (до 2 МБ)</label>
      <input type="file" id="fFile" accept="image/*,application/pdf" />
      <div id="existingFileBox"></div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-sm" onclick="closeModal('editModal')">Отмена</button>
      <button type="button" class="btn-add" id="saveCaseBtn">Сохранить дело</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ПРОСМОТРА КАРТОЧКИ -->
<div class="modal-backdrop" id="viewModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="vTitle">Карточка дела</h2>
      <button class="close-btn" onclick="closeModal('viewModal')">×</button>
    </div>
    <div id="vBody"></div>
    <div class="modal-footer">
      <button type="button" class="btn-sm btn-danger-sm" id="vDeleteBtn">🗑 Удалить</button>
      <button type="button" class="btn-sm" id="vEditBtn">✏ Редактировать</button>
      <button type="button" class="btn-sm" onclick="closeModal('viewModal')">Закрыть</button>
    </div>
  </div>
</div>

<script>
  const API_URL = 'https://functions.yandexcloud.net/d4evinqca7b4om7235re';
  const STORAGE_AUTH_KEY = 'lp_yc_auth_v22';
  const STORAGE_CACHE_KEY = 'lp_yc_cases_v22';

  let creds = null;
  let cases = [];
  let currentFilter = 'active';
  let currentLfo = 'ALL';
  let currentFileObj = null;
  let viewingId = null;

  window.addEventListener('DOMContentLoaded', () => {
    const savedAuth = localStorage.getItem(STORAGE_AUTH_KEY);
    if (savedAuth) {
      try {
        creds = JSON.parse(savedAuth);
        showApp();
        loadFromCloud();
      } catch (e) {
        localStorage.removeItem(STORAGE_AUTH_KEY);
      }
    }
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const login = document.getElementById('loginInput').value.trim();
    const password = document.getElementById('passInput').value.trim();
    const errEl = document.getElementById('authError');
    errEl.textContent = '';

    if (!login || !password) {
      errEl.textContent = 'Введите логин и пароль';
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Подключение к Яндекс Облаку...';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ login, password, action: 'load' })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка входа');

      creds = { login, password };
      localStorage.setItem(STORAGE_AUTH_KEY, JSON.stringify(creds));
      cases = Array.isArray(data.cases) ? data.cases : [];
      localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(cases));
      showApp();
      renderAll();
      setStatus('Синхронизировано: ' + new Date().toLocaleTimeString());
    } catch (e) {
      errEl.textContent = e.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Войти в систему';
    }
  });

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(STORAGE_AUTH_KEY);
    creds = null;
    document.getElementById('appScreen').style.display = 'none';
    document.getElementById('authScreen').style.display = 'flex';
  });

  function showApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').style.display = 'block';
    const cached = localStorage.getItem(STORAGE_CACHE_KEY);
    if (cached) {
      try { cases = JSON.parse(cached); renderAll(); } catch (e) {}
    }
  }

  function setStatus(msg, isError = false) {
    const el = document.getElementById('syncStatus');
    el.textContent = msg;
    el.style.color = isError ? '#fca5a5' : '#94a3b8';
  }

  async function loadFromCloud() {
    if (!creds) return;
    setStatus('Загрузка из Яндекс Облака...');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...creds, action: 'load' })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка загрузки');
      cases = Array.isArray(data.cases) ? data.cases : [];
      localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(cases));
      renderAll();
      setStatus('Обновлено: ' + new Date().toLocaleTimeString());
    } catch (e) {
      setStatus('Ошибка: ' + e.message, true);
    }
  }

  async function saveToCloud() {
    localStorage.setItem(STORAGE_CACHE_KEY, JSON.stringify(cases));
    renderAll();
    if (!creds) return;
    setStatus('Сохранение в облако...');
    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...creds, action: 'save', cases })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Ошибка сохранения');
      setStatus('Сохранено в облаке: ' + new Date().toLocaleTimeString());
    } catch (e) {
      setStatus('Ошибка сохранения: ' + e.message, true);
    }
  }

  document.getElementById('syncBtn').addEventListener('click', loadFromCloud);

  function getDaysDiff(dateStr) {
    if (!dateStr) return null;
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(dateStr + 'T00:00:00');
    return Math.round((target - today) / 86400000);
  }

  function formatDateRu(dateStr) {
    if (!dateStr) return 'Без даты';
    const parts = dateStr.split('-');
    if (parts.length !== 3) return dateStr;
    return `${parts[2]}.${parts[1]}.${parts[0]}`;
  }

  function renderAll() {
    let cntWork = 0, cntCourt = 0, cntWait = 0, cntUrgent = 0, cntOverdue = 0;
    const lfoCounts = {};

    cases.forEach(c => {
      const lfo = (c.lfo || 'Без ЛФО').trim();
      lfoCounts[lfo] = (lfoCounts[lfo] || 0) + 1;

      if (c.status === 'done') return;
      if (c.status === 'court') cntCourt++;
      else if (c.status === 'nodate' || !c.date) cntWait++;
      else cntWork++;

      const diff = getDaysDiff(c.date);
      if (diff !== null) {
        if (diff < 0) cntOverdue++;
        else if (diff <= 3) cntUrgent++;
      }
    });

    document.getElementById('cntWork').textContent = cntWork;
    document.getElementById('cntCourt').textContent = cntCourt;
    document.getElementById('cntWait').textContent = cntWait;
    document.getElementById('cntUrgent').textContent = cntUrgent;
    document.getElementById('cntOverdue').textContent = cntOverdue;

    const lfoSelect = document.getElementById('lfoFilter');
    const prevLfo = lfoSelect.value;
    lfoSelect.innerHTML = `<option value="ALL">Все ЛФО (${cases.length})</option>`;
    Object.keys(lfoCounts).sort().forEach(lfo => {
      const opt = document.createElement('option');
      opt.value = lfo;
      opt.textContent = `${lfo} (${lfoCounts[lfo]})`;
      lfoSelect.appendChild(opt);
    });
    if ([...lfoSelect.options].some(o => o.value === prevLfo)) lfoSelect.value = prevLfo;

    const q = document.getElementById('searchInput').value.trim().toLowerCase();
    const filtered = cases.filter(c => {
      const lfo = (c.lfo || 'Без ЛФО').trim();
      if (currentLfo !== 'ALL' && lfo !== currentLfo) return false;

      if (q) {
        const hay = `${c.debtor} ${c.number} ${c.organ} ${c.lfo} ${c.note} ${c.category}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }

      const diff = getDaysDiff(c.date);
      if (currentFilter === 'done') return c.status === 'done';
      if (c.status === 'done') return false;

      if (currentFilter === 'overdue') return diff !== null && diff < 0;
      if (currentFilter === 'urgent') return diff !== null && diff >= 0 && diff <= 3;
      if (currentFilter === 'court') return c.status === 'court';
      if (currentFilter === 'nodate') return c.status === 'nodate' || !c.date;
      return true;
    });

    filtered.sort((a, b) => {
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return a.date.localeCompare(b.date);
    });

    const listEl = document.getElementById('casesList');
    if (!filtered.length) {
      listEl.innerHTML = '<div class="empty-state">Нет дел по выбранному фильтру. Нажмите «+ Новое дело», чтобы добавить задачу.</div>';
      return;
    }

    listEl.innerHTML = filtered.map(c => {
      const diff = getDaysDiff(c.date);
      let cardClass = 'case-card';
      let badgeClass = 'badge';
      let badgeText = c.category || 'В работе';

      if (c.status === 'done') {
        cardClass += ' done'; badgeClass += ' done'; badgeText = '✅ Завершено';
      } else if (diff !== null && diff < 0) {
        cardClass += ' overdue'; badgeClass += ' overdue'; badgeText = `🔥 Просрочено на ${Math.abs(diff)} дн.`;
      } else if (diff !== null && diff <= 3) {
        cardClass += ' urgent'; badgeClass += ' urgent';
        badgeText = diff === 0 ? '⏰ Сегодня!' : `⏰ Через ${diff} дн.`;
      } else if (c.status === 'court') {
        cardClass += ' court'; badgeClass += ' court';
        badgeText = `⚖ Суд ${c.time || ''}`;
      }

      const dateText = c.date ? `${formatDateRu(c.date)}${c.status === 'court' && c.time ? ' в ' + c.time : ''}` : 'Дата не назначена';

      return `
        <div class="${cardClass}" onclick="openViewModal('${c.id}')">
          <div>
            <div class="card-top">
              <span class="${badgeClass}">${escapeHtml(badgeText)}</span>
              <span class="meta-line">${escapeHtml(c.lfo || '')}</span>
            </div>
            <div class="debtor-name" style="margin-top:6px;">${escapeHtml(c.debtor)}</div>
            <div class="meta-line" style="margin-top:3px;">
              ${c.number ? '№ ' + escapeHtml(c.number) + ' • ' : ''}${escapeHtml(c.organ || '')}
            </div>
          </div>
          ${c.note ? `<div class="task-preview">${escapeHtml(c.note)}</div>` : ''}
          <div class="card-footer">
            <span>📅 ${escapeHtml(dateText)}</span>
            <span>${c.file ? '📎 Файл' : ''}</span>
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('filterTabs').addEventListener('click', e => {
    if (!e.target.classList.contains('tab-btn')) return;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentFilter = e.target.dataset.filter;
    renderAll();
  });

  document.getElementById('lfoFilter').addEventListener('change', e => {
    currentLfo = e.target.value;
    renderAll();
  });

  document.getElementById('searchInput').addEventListener('input', renderAll);

  window.addDays = function(days) {
    const d = new Date();
    d.setDate(d.getDate() + days);
    document.getElementById('fDate').value = d.toISOString().slice(0, 10);
  };

  document.getElementById('newCaseBtn').addEventListener('click', () => openEditModal(null));

  function openEditModal(caseObj) {
    currentFileObj = caseObj && caseObj.file ? { ...caseObj.file } : null;
    document.getElementById('editModalTitle').textContent = caseObj ? 'Редактировать дело' : 'Новое дело / задача';
    document.getElementById('editId').value = caseObj ? caseObj.id : '';
    document.getElementById('fStatus').value = caseObj ? caseObj.status : 'work';
    document.getElementById('fCategory').value = caseObj ? (caseObj.category || 'ИП / ФССП') : 'ИП / ФССП';
    document.getElementById('fLfo').value = caseObj ? (caseObj.lfo || '') : '';
    document.getElementById('fNumber').value = caseObj ? (caseObj.number || '') : '';
    document.getElementById('fDebtor').value = caseObj ? (caseObj.debtor || '') : '';
    document.getElementById('fOrgan').value = caseObj ? (caseObj.organ || '') : '';
    document.getElementById('fDate').value = caseObj ? (caseObj.date || '') : '';
    document.getElementById('fTime').value = caseObj ? (caseObj.time || '10:00') : '10:00';
    document.getElementById('fNote').value = caseObj ? (caseObj.note || '') : '';
    document.getElementById('fLink').value = caseObj ? (caseObj.link || '') : '';
    document.getElementById('fHistoryAdd').value = '';
    document.getElementById('fFile').value = '';

    renderExistingFileBox();
    document.getElementById('editModal').style.display = 'flex';
  }

  function renderExistingFileBox() {
    const box = document.getElementById('existingFileBox');
    if (currentFileObj) {
      box.innerHTML = `<div class="file-pill">📎 ${escapeHtml(currentFileObj.name)} <button type="button" class="btn-sm btn-danger-sm" onclick="removeAttachment()">×</button></div>`;
    } else {
      box.innerHTML = '';
    }
  }

  window.removeAttachment = function() {
    currentFileObj = null;
    renderExistingFileBox();
  };

  document.getElementById('fFile').addEventListener('change', e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      alert('Файл превышает 2 МБ. Выберите файл меньшего размера.');
      e.target.value = '';
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      currentFileObj = { name: file.name, type: file.type, data: reader.result };
      renderExistingFileBox();
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('saveCaseBtn').addEventListener('click', async () => {
    const debtor = document.getElementById('fDebtor').value.trim();
    if (!debtor) {
      alert('Укажите должника (ФИО или наименование)');
      return;
    }

    const id = document.getElementById('editId').value;
    const histNote = document.getElementById('fHistoryAdd').value.trim();
    const nowStr = new Date().toLocaleDateString('ru-RU');

    if (id) {
      const idx = cases.findIndex(c => c.id === id);
      if (idx !== -1) {
        const hist = Array.isArray(cases[idx].history) ? [...cases[idx].history] : [];
        if (histNote) hist.unshift({ date: nowStr, text: histNote });
        cases[idx] = {
          ...cases[idx],
          status: document.getElementById('fStatus').value,
          category: document.getElementById('fCategory').value,
          lfo: document.getElementById('fLfo').value.trim(),
          number: document.getElementById('fNumber').value.trim(),
          debtor,
          organ: document.getElementById('fOrgan').value.trim(),
          date: document.getElementById('fDate').value,
          time: document.getElementById('fTime').value,
          note: document.getElementById('fNote').value.trim(),
          link: document.getElementById('fLink').value.trim(),
          history: hist,
          file: currentFileObj
        };
      }
    } else {
      const hist = [{ date: nowStr, text: histNote || 'Дело создано в планировщике' }];
      cases.unshift({
        id: 'c_' + Date.now(),
        status: document.getElementById('fStatus').value,
        category: document.getElementById('fCategory').value,
        lfo: document.getElementById('fLfo').value.trim(),
        number: document.getElementById('fNumber').value.trim(),
        debtor,
        organ: document.getElementById('fOrgan').value.trim(),
        date: document.getElementById('fDate').value,
        time: document.getElementById('fTime').value,
        note: document.getElementById('fNote').value.trim(),
        link: document.getElementById('fLink').value.trim(),
        history: hist,
        file: currentFileObj
      });
    }

    closeModal('editModal');
    await saveToCloud();
  });

  window.openViewModal = function(id) {
    const c = cases.find(item => item.id === id);
    if (!c) return;
    viewingId = id;

    document.getElementById('vTitle').textContent = c.debtor;
    const histHtml = (c.history && c.history.length)
      ? c.history.map(h => `<div class="history-item"><span class="history-date">${escapeHtml(h.date)}</span>${escapeHtml(h.text)}</div>`).join('')
      : '<div class="meta-line">Записей пока нет</div>';

    const fileHtml = c.file
      ? `<div class="detail-row"><strong>Файл:</strong> <a href="${c.file.data}" download="${escapeHtml(c.file.name)}" style="color:#60a5fa;">📎 Скачать ${escapeHtml(c.file.name)}</a></div>`
      : '';

    const linkHtml = c.link
      ? `<div class="detail-row"><strong>Ссылка:</strong> <a href="${escapeHtml(c.link)}" target="_blank" rel="noopener" style="color:#60a5fa;">Открыть источник ↗</a></div>`
      : '';

    document.getElementById('vBody').innerHTML = `
      <div class="detail-row"><strong>Категория:</strong> ${escapeHtml(c.category || '—')}</div>
      <div class="detail-row"><strong>ЛФО:</strong> ${escapeHtml(c.lfo || '—')}</div>
      <div class="detail-row"><strong>№ дела / ИП:</strong> ${escapeHtml(c.number || '—')}</div>
      <div class="detail-row"><strong>Орган:</strong> ${escapeHtml(c.organ || '—')}</div>
      <div class="detail-row"><strong>Контр. дата:</strong> ${escapeHtml(formatDateRu(c.date))} ${c.status === 'court' && c.time ? '(' + escapeHtml(c.time) + ')' : ''}</div>
      ${linkHtml}
      ${fileHtml}
      <div class="detail-row"><strong>Задача:</strong><div class="task-preview" style="-webkit-line-clamp:unset;margin-top:4px;">${escapeHtml(c.note || 'Нет описания')}</div></div>
      <div class="detail-row"><strong>История действий:</strong><div class="history-list">${histHtml}</div></div>
    `;

    document.getElementById('viewModal').style.display = 'flex';
  };

  document.getElementById('vEditBtn').addEventListener('click', () => {
    const c = cases.find(item => item.id === viewingId);
    closeModal('viewModal');
    if (c) openEditModal(c);
  });

  document.getElementById('vDeleteBtn').addEventListener('click', async () => {
    if (!confirm('Удалить это дело безвозвратно?')) return;
    cases = cases.filter(item => item.id !== viewingId);
    closeModal('viewModal');
    await saveToCloud();
  });

  window.closeModal = function(id) {
    document.getElementById(id).style.display = 'none';
  };

  function escapeHtml(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
</script>
</body>
</html>
