name: Build LegalPlanner APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Prepare Android Project
        run: |
          mkdir -p app/src/main/java/com/lawyer/planner app/src/main/assets app/src/main/res/drawable
          mv MainActivity.java app/src/main/java/com/lawyer/planner/MainActivity.java
          mv index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "LegalPlanner"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.lawyer.planner'
              compileSdk 34
              defaultConfig {
                  applicationId "com.lawyer.planner"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes { release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          EOF

          python3 -c 'open("app/src/main/AndroidManifest.xml", "w").write("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://android.com\">\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application android:label=\"Планировщик юриста\" android:icon=\"@drawable/ic_launcher\" android:theme=\"@style/Theme.AppCompat.Light.NoActionBar\">\n        <activity android:name=\".MainActivity\" android:exported=\"true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>")'

          python3 -c 'open("app/src/main/res/drawable/ic_launcher.xml", "w").write("<vector xmlns:android=\"http://android.com\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\"><path android:fillColor=\"#1E3A8A\" android:pathData=\"M0,0h108v108h-108z\"/><path android:fillColor=\"#FFFFFF\" android:pathData=\"M34,34h40v8h-16v32h-8v-32h-16z\"/></vector>")'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegalPlanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
